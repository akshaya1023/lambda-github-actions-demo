name: Deploy Lambda using OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff pytest pytest-cov

      - name: Run Black Formatting Check
        run: |
          black --check .

      - name: Run Ruff Lint Check
        run: |
          ruff check . --ignore BLE001,I001,C401,DTZ005,B017

      - name: Run Unit Tests with Coverage
        run: |
          pytest \
            --cov=lambda_function \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Debug GitHub Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Create Deployment Package
        run: |
          zip -r function.zip lambda_function.py

      - name: Upload ZIP to S3
        run: |
          aws s3 cp function.zip \
            s3://github-cicd-deployment-bucket/${{ github.sha }}.zip

      - name: Deploy Lambda from S3
        run: |
          aws lambda update-function-code \
            --function-name veeva_rim_chatbot_query \
            --s3-bucket github-cicd-deployment-bucket \
            --s3-key ${{ github.sha }}.zip